<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mudofaa Vazirligi | Harbiy kasbiy saralash</title>
  <link rel="icon" type="image/x-icon" href="123.png">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      
      /* SIFROVIZATSIYA FONI */
      background: #0a0f1f;
      position: relative;
      overflow: hidden;
    }

    /* Sifrovizatsiya fon elementlari */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, rgba(0, 255, 200, 0.05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0, 255, 200, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 0;
      pointer-events: none;
    }

    /* Kriptografik matnlar */
    body::after {
      content: "ENCRYPTED SECURE CLASSIFIED CIPHER AES RSA SHA256 • ENCRYPTED SECURE CLASSIFIED CIPHER AES RSA SHA256 • ";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      color: rgba(0, 255, 200, 0.1);
      font-size: 14px;
      font-family: 'Courier New', monospace;
      white-space: nowrap;
      overflow: hidden;
      line-height: 50px;
      transform: rotate(-3deg) scale(1.2);
      z-index: 0;
      pointer-events: none;
      animation: scrollText 50s linear infinite;
    }

    @keyframes scrollText {
      0% { transform: rotate(-3deg) translateX(-10%) scale(1.2); }
      100% { transform: rotate(-3deg) translateX(-50%) scale(1.2); }
    }

    /* Asosiy karta */
    .modern-defense-card {
      max-width: 450px;
      width: 100%;
      height: 98vh;
      height: 98dvh;
      background: rgba(5, 15, 30, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 2rem;
      box-shadow: 0 40px 70px -20px #000000, 0 0 0 2px rgba(0, 255, 200, 0.3);
      border: 1px solid rgba(0, 255, 200, 0.4);
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .modern-defense-card::-webkit-scrollbar {
      width: 3px;
      background: transparent;
    }
    
    .modern-defense-card::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 200, 0.3);
      border-radius: 10px;
    }

    /* Header */
    .emblem-header {
      background: linear-gradient(145deg, #071a2e, #051524);
      padding: 1.2rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.5rem;
      border-bottom: 4px solid #00cc99;
      flex-shrink: 0;
    }

    .emblem-img {
      width: 70px;
      height: auto;
      animation: emblemGlow 3s ease-in-out infinite;
    }

    .emblem-img img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 50%;
      background: rgba(0, 255, 200, 0.1);
      padding: 5px;
      border: 2px solid #00cc99;
      box-shadow: 0 0 15px #00ffc3;
    }

    /* Logotip uchun yonib-o'chadigan soya animatsiyasi */
    @keyframes emblemGlow {
      0% {
        filter: drop-shadow(0 0 5px #00ffc3);
      }
      25% {
        filter: drop-shadow(0 0 15px #00ffff);
      }
      50% {
        filter: drop-shadow(0 0 25px #00ffaa);
      }
      75% {
        filter: drop-shadow(0 0 15px #00ffff);
      }
      100% {
        filter: drop-shadow(0 0 5px #00ffc3);
      }
    }

    .title h1 {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.2;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 5px #00ffc3;
    }

    .title h1 span {
      display: block;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 1px;
      margin-top: 0.3rem;
      color: #aaffdd;
      text-transform: none;
      border-top: 1px dashed #00cc99;
      padding-top: 0.3rem;
    }

    /* MAIN CONTENT - flex-grow bilan to'ldiriladi */
    .main-content {
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1 0 auto;
      overflow-y: auto;
    }

    /* RASMIY VEB SAYT */
    .official-web-block {
      background: rgba(0, 20, 40, 0.95);
      border: 2px solid #00cc99;
      border-radius: 1.5rem;
      padding: 1.2rem 1rem;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
    }

    .web-icon-large {
      background: #0a2a3a;
      width: 60px;
      height: 60px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.8rem;
      border: 2px solid #00ffc3;
      box-shadow: 0 0 12px #00ffc3;
    }

    .web-icon-large i {
      font-size: 2rem;
      color: #8cfff0;
    }

    .official-web-block h3 {
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: #aaffdd;
      margin-bottom: 0.3rem;
    }

    .web-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin: 0.2rem 0 0.3rem;
      text-shadow: 0 0 10px #00ffc3;
    }

    .web-description {
      color: #ccffff;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .web-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0a2e45;
      color: white;
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      border: 2px solid #00ffc3;
      box-shadow: 0 0 12px #00ffc3;
      transition: transform 0.1s ease;
    }

    .web-link:active {
      transform: scale(0.92);
    }

    .web-link:not(:active) {
      transition: transform 0.2s ease;
    }

    /* SOCIAL CARDS - YONIB-O'CHIB TURADIGAN SOYA */
    .social-card {
      background: rgba(0, 25, 45, 0.98);
      border: 2px solid #00aaff;
      border-radius: 1.5rem;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.3);
      transition: all 0.2s ease;
      cursor: pointer;
      
      /* YONIB-O'CHIB TURADIGAN SOYA ANIMATSIYASI */
      animation: glowPulse 2.5s ease-in-out infinite;
    }

    /* Har bir kartochka uchun turli xil tezlik */
    .social-card:nth-child(1) { /* Telegram */
      animation: glowPulse 2.2s ease-in-out infinite;
    }
    
    .social-card:nth-child(2) { /* Instagram */
      animation: glowPulse 2.7s ease-in-out infinite 0.3s;
    }
    
    .social-card:nth-child(3) { /* YouTube */
      animation: glowPulse 2.4s ease-in-out infinite 0.6s;
    }
    
    .social-card:nth-child(4) { /* Veb-sayt */
      animation: glowPulse 2.9s ease-in-out infinite 0.9s;
    }
    
    .social-card:nth-child(5) { /* ARIZA BERISH */
      animation: glowPulse 2.3s ease-in-out infinite 0.2s;
    }

    /* SOYA YONIB-O'CHISH ANIMATSIYASI */
    @keyframes glowPulse {
      0% {
        box-shadow: 0 0 10px rgba(0, 200, 255, 0.3), 0 0 20px rgba(0, 255, 200, 0.1);
        border-color: #00aaff;
      }
      25% {
        box-shadow: 0 0 20px #00ffff, 0 0 40px #00ccff;
        border-color: #88ffff;
      }
      50% {
        box-shadow: 0 0 30px #00ffaa, 0 0 60px #00ffcc;
        border-color: #ffffff;
      }
      75% {
        box-shadow: 0 0 20px #00ffff, 0 0 40px #00ccff;
        border-color: #88ffff;
      }
      100% {
        box-shadow: 0 0 10px rgba(0, 200, 255, 0.3), 0 0 20px rgba(0, 255, 200, 0.1);
        border-color: #00aaff;
      }
    }

    .social-card:active {
      transform: scale(0.97);
    }

    .social-card i {
      font-size: 2.2rem;
      color: #88ffe1;
      width: 45px;
      text-align: center;
      filter: drop-shadow(0 0 5px #00ffc3);
    }

    .social-card .name {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 8px #00ffc3;
    }

    .social-card .name a {
      color: inherit;
      text-decoration: none;
      display: block;
      width: 100%;
    }

    /* ARIZA BERISH uchun maxsus rasm (321.png) */
    .social-card .custom-icon {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .social-card .custom-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 8px #88ffaa);
    }

    /* Telefon kartasi */
    .phone-special-card {
      background: rgba(0, 30, 50, 0.98);
      border: 3px solid #00ccaa;
      border-radius: 1.8rem;
      padding: 1.2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 0 25px #00ccaa;
      transition: transform 0.1s ease;
      cursor: pointer;
      margin-bottom: 0.5rem;
    }

    .phone-special-card:active {
      transform: scale(0.97);
    }

    .phone-icon-big {
      background: #00a38c;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #001a1a;
      border: 2px solid #aaffee;
      box-shadow: 0 0 15px #88ffee;
    }

    .phone-details {
      text-align: center;
      width: 100%;
    }

    .phone-details .phone-label {
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #88ffdd;
      font-size: 0.75rem;
      text-shadow: 0 0 5px #00ffc3;
    }

    .phone-details .big-phone {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      white-space: normal;
      word-break: break-word;
      text-shadow: 0 0 10px #00ffc3;
    }

    .big-phone i {
      color: #88ffdd;
      margin-left: 5px;
    }

    .call-us-btn {
      background: #0f3a4a;
      color: white;
      padding: 0.7rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px solid #00ffc3;
      box-shadow: 0 0 12px #00ffc3;
      width: 100%;
      transition: transform 0.1s ease;
      text-decoration: none;
      cursor: pointer;
    }

    .call-us-btn:active {
      transform: scale(0.94);
    }

    /* FOOTER */
    .security-footer {
      background: rgba(0, 10, 25, 0.98);
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      text-align: center;
      color: #aaffdd;
      border-top: 2px solid #00cc99;
      font-size: 0.75rem;
      flex-shrink: 0;
      width: 100%;
      margin-top: auto;
    }

    .footer-phone-row {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      width: 100%;
    }

    .footer-phone-row span {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-size: 0.8rem;
    }

    .footer-phone-row i {
      color: #88ffdd;
      width: 18px;
    }

    /* IPHONE SE */
    @media (max-width: 380px) {
      body {
        padding: 0.3rem;
      }
      
      .modern-defense-card {
        border-radius: 1.5rem;
      }
      
      .emblem-img {
        width: 60px;
      }
      
      .title h1 {
        font-size: 0.85rem;
      }
      
      .title h1 span {
        font-size: 0.6rem;
      }
      
      .main-content {
        gap: 0.9rem;
        padding: 0.6rem 0.8rem;
      }
      
      .social-card {
        padding: 0.8rem 0.8rem;
        gap: 0.8rem;
      }
      
      .social-card i {
        font-size: 1.8rem;
        width: 35px;
      }
      
      .social-card .custom-icon {
        width: 35px;
        height: 35px;
      }
      
      .social-card .name {
        font-size: 1.1rem;
      }
      
      .web-icon-large {
        width: 50px;
        height: 50px;
      }
      
      .web-icon-large i {
        font-size: 1.8rem;
      }
      
      .web-title {
        font-size: 1.1rem;
      }
      
      .web-link {
        padding: 0.5rem 1.2rem;
        font-size: 0.8rem;
      }
      
      .phone-icon-big {
        width: 50px;
        height: 50px;
        font-size: 1.8rem;
      }
      
      .phone-details .big-phone {
        font-size: 1.1rem;
      }
      
      .call-us-btn {
        font-size: 0.9rem;
        padding: 0.6rem 1rem;
      }
      
      .footer-phone-row span {
        font-size: 0.7rem;
      }
    }

    a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>

</body>
</html>
