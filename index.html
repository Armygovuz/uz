<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mudofaa Vazirligi | Harbiy kasbiy saralash | Sifrovizatsiya</title>
  <link rel="icon" type="image/x-icon" href="123.png">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      background: #0a0f1f;
      position: relative;
      overflow: hidden;
    }

    /* Sifrovizatsiya fon elementlari */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, rgba(0, 255, 200, 0.05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0, 255, 200, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: "🔐 ENCRYPTED • SECURE • CLASSIFIED • CIPHER • AES • RSA • SHA256 • 🔐";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      color: rgba(0, 255, 200, 0.08);
      font-size: 12px;
      font-family: 'Courier New', monospace;
      white-space: nowrap;
      overflow: hidden;
      line-height: 40px;
      transform: rotate(-4deg) scale(1.3);
      z-index: 0;
      pointer-events: none;
      animation: scrollCipher 45s linear infinite;
    }

    @keyframes scrollCipher {
      0% { transform: rotate(-4deg) translateX(-8%) scale(1.3); }
      100% { transform: rotate(-4deg) translateX(-50%) scale(1.3); }
    }

    /* Asosiy karta */
    .modern-defense-card {
      max-width: 450px;
      width: 100%;
      height: 96vh;
      height: 96dvh;
      background: rgba(5, 15, 30, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2rem;
      box-shadow: 0 40px 70px -20px #000, 0 0 0 2px rgba(0, 255, 200, 0.35);
      border: 1px solid rgba(0, 255, 200, 0.5);
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
    }

    .modern-defense-card::-webkit-scrollbar {
      width: 3px;
      background: transparent;
    }
    .modern-defense-card::-webkit-scrollbar-thumb {
      background: #00cc99;
      border-radius: 10px;
    }

    /* Header */
    .emblem-header {
      background: linear-gradient(145deg, #071a2e, #051524);
      padding: 1rem 1rem 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.5rem;
      border-bottom: 3px solid #00cc99;
      flex-shrink: 0;
    }

    .emblem-img {
      width: 70px;
      /* animation: emblemPulse 2.5s ease-in-out infinite; */
    }
    .emblem-img img {
      width: 100%;
      border-radius: 50%;
      background: rgba(0, 255, 200, 0.1);
      padding: 5px;
      border: 2px solid #00cc99;
      box-shadow: 0 0 20px #00ffc3;
    }
    @keyframes emblemPulse {
      0% { filter: drop-shadow(0 0 3px #00ffc3); transform: scale(1);}
      50% { filter: drop-shadow(0 0 18px #00ffaa); transform: scale(1.02);}
      100% { filter: drop-shadow(0 0 3px #00ffc3); transform: scale(1);}
    }

    .title h1 {
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1.2;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 6px #00ffc3;
    }
    .title h1 span {
      display: block;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 1px;
      margin-top: 0.2rem;
      color: #bbffee;
      border-top: 1px dashed #00cc99;
      padding-top: 0.25rem;
    }

    /* MAIN CONTENT */
    .main-content {
      padding: 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1 0 auto;
    }

    /* ========== BUTTON STYLE (Barcha tugmalar) ========== */
    /* Asosiy tugma uslubi - butun maydon bosiladigan qilib */
    .action-button {
      background: rgba(0, 25, 45, 0.96);
      backdrop-filter: blur(4px);
      border: 2px solid #00aaff;
      border-radius: 2rem;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.2);
      width: 100%;
      position: relative;
      overflow: hidden;
      /* Yonib turuvchi asos effekt */
      animation: buttonSoftGlow 2.8s ease-in-out infinite;
    }

    /* Har bir tugma uchun turli vaqtda yonish */
    .action-button:nth-child(1) { animation: buttonSoftGlow 2.2s infinite; }
    .action-button:nth-child(2) { animation: buttonSoftGlow 2.7s infinite 0.3s; }
    .action-button:nth-child(3) { animation: buttonSoftGlow 2.4s infinite 0.6s; }
    .action-button:nth-child(4) { animation: buttonSoftGlow 3.0s infinite 0.9s; }
    .action-button:nth-child(5) { animation: buttonSoftGlow 2.5s infinite 0.2s; }

    @keyframes buttonSoftGlow {
      0% {
        box-shadow: 0 0 8px rgba(0, 200, 255, 0.3);
        border-color: #00aaff;
      }
      50% {
        box-shadow: 0 0 22px #00ffc3, 0 0 30px #00ccff;
        border-color: #aaffee;
      }
      100% {
        box-shadow: 0 0 8px rgba(0, 200, 255, 0.3);
        border-color: #00aaff;
      }
    }

    /* YONIB UCHISH (IGNITION) ANIMATSIYASI - ketma-ketlikda yonadi */
    @keyframes igniteBlast {
      0% {
        box-shadow: 0 0 0px rgba(0, 255, 200, 0);
        border-color: #00aaff;
        background: rgba(0, 25, 45, 0.96);
        transform: scale(1);
      }
      20% {
        box-shadow: 0 0 18px #ffaa33, 0 0 38px #ff7722;
        border-color: #ffcc66;
        background: rgba(50, 35, 15, 0.98);
        transform: scale(0.98);
      }
      45% {
        box-shadow: 0 0 35px #00ffc3, 0 0 55px #00ffaa;
        border-color: #ffffaa;
        background: rgba(0, 70, 90, 0.98);
        transform: scale(1.01);
      }
      75% {
        box-shadow: 0 0 45px #88ffdd, 0 0 70px #00ffcc;
        border-color: #ffffff;
        background: rgba(0, 55, 80, 0.98);
      }
      100% {
        box-shadow: 0 0 25px #00ffc3, 0 0 35px #00ffaa;
        border-color: #00ffc3;
        background: rgba(0, 45, 70, 0.96);
        transform: scale(1);
      }
    }

    @keyframes iconExplode {
      0% { transform: scale(1); text-shadow: 0 0 0px cyan; filter: drop-shadow(0 0 2px #00ffc3);}
      30% { transform: scale(1.35); text-shadow: 0 0 18px #ffee88; filter: drop-shadow(0 0 15px #ffaa44);}
      70% { transform: scale(1.1); text-shadow: 0 0 22px #00ffdd; filter: drop-shadow(0 0 12px #00ffc3);}
      100% { transform: scale(1); text-shadow: 0 0 12px #00ffc3; filter: drop-shadow(0 0 8px #00ffc3);}
    }

    .action-button.ignite-active {
      animation: igniteBlast 0.7s cubic-bezier(0.25, 1.2, 0.4, 1) forwards;
      pointer-events: none;
    }

    .action-button.ignite-active i,
    .action-button.ignite-active .button-icon,
    .action-button.ignite-active .custom-icon-img {
      animation: iconExplode 0.6s ease forwards;
    }

    /* Ikonka va matn */
    .action-button i {
      font-size: 2.2rem;
      width: 48px;
      text-align: center;
      color: #88ffe1;
      filter: drop-shadow(0 0 6px #00ffc3);
      transition: all 0.1s;
    }

    .custom-icon-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px #88ffaa);
    }

    .button-text {
      flex: 1;
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 8px #00ffc3;
      letter-spacing: 0.5px;
    }
    .button-text small {
      font-size: 0.7rem;
      font-weight: 400;
      color: #bbffee;
      display: block;
      margin-top: 2px;
    }

    /* TELEFON KARTASI (ham bosiladigan butun maydon) */
    .phone-card {
      background: rgba(0, 30, 50, 0.98);
      border: 3px solid #00ccaa;
      border-radius: 2rem;
      padding: 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      cursor: pointer;
      transition: all 0.1s ease;
      margin-top: 0.2rem;
      animation: phoneGlow 3s infinite;
      position: relative;
      overflow: hidden;
    }
    @keyframes phoneGlow {
      0% { box-shadow: 0 0 10px #00ccaa; border-color: #00ccaa; }
      50% { box-shadow: 0 0 30px #88ffdd; border-color: #aaffee; }
      100% { box-shadow: 0 0 10px #00ccaa; border-color: #00ccaa; }
    }
    .phone-card.ignite-active {
      animation: igniteBlast 0.7s cubic-bezier(0.25, 1.2, 0.4, 1) forwards;
      pointer-events: none;
    }
    .phone-card.ignite-active .phone-icon-big,
    .phone-card.ignite-active .call-btn {
      animation: iconExplode 0.6s ease forwards;
    }

    .phone-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .phone-icon-big {
      background: #00a38c;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #001a1a;
      border: 2px solid #aaffee;
      box-shadow: 0 0 18px #88ffee;
    }
    .phone-details {
      text-align: center;
    }
    .phone-label {
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 2px;
      color: #88ffdd;
      font-size: 0.7rem;
    }
    .big-phone-number {
      font-size: 1.3rem;
      font-weight: 800;
      color: white;
      text-shadow: 0 0 10px #00ffc3;
    }
    .call-btn {
      background: #0f3a4a;
      color: white;
      padding: 0.7rem 1rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 2px solid #00ffc3;
      box-shadow: 0 0 15px #00ffc3;
      width: 100%;
      cursor: pointer;
      transition: 0.1s;
    }

    /* FOOTER */
    .security-footer {
      background: rgba(0, 10, 25, 0.98);
      padding: 0.7rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      text-align: center;
      color: #aaffdd;
      border-top: 2px solid #00cc99;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    .footer-badge {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    @media (max-width: 400px) {
      .action-button i {
        font-size: 1.8rem;
        width: 40px;
      }
      .button-text {
        font-size: 1.1rem;
      }
      .custom-icon-img {
        width: 38px;
        height: 38px;
      }
      .big-phone-number {
        font-size: 1rem;
      }
      .phone-icon-big {
        width: 50px;
        height: 50px;
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="modern-defense-card">
    <!-- HEADER -->
    <div class="emblem-header">
      <div class="emblem-img">
        <img src="123.png" alt="Gerb" onerror="this.src='https://placehold.co/70x70/0a2a3a/00cc99?text=MD'">
      </div>
      <div class="title">
        <h1>
          OʻZBEKISTON RESPUBLIKASI MUDOFAA VAZIRLIGI <br> HARBIY-KASBIY SARALASH BOSHQARMASI
          
        </h1>
      </div>
    </div>

    <!-- MAIN BUTTONS - BUTUN MAYDON BOSILADIGAN QILIB (qayeriga bossa ham ishlaydi) -->
    <div class="main-content">
      
      <!-- TELEGRAM BUTTON -->
      <div class="action-button" data-url="https://t.me/Armygovuz" data-platform="telegram">
        <i class="fab fa-telegram"></i>
        <div class="button-text">TELEGRAM </div>
      </div>

      <!-- INSTAGRAM BUTTON -->
      <div class="action-button" data-url="https://www.instagram.com/Armygovuz" data-platform="instagram">
        <i class="fab fa-instagram"></i>
        <div class="button-text">INSTAGRAM </div>
      </div>

      <!-- YOUTUBE BUTTON -->
      <div class="action-button" data-url="https://www.youtube.com/@Armygovuz" data-platform="youtube">
        <i class="fab fa-youtube"></i>
        <div class="button-text">YOUTUBE </div>
      </div>

      <!-- VEB-SAYT BUTTON -->
      <div class="action-button" data-url="https://army.gov.uz" data-platform="website">
        <i class="fas fa-globe"></i>
        <div class="button-text">VEB-SAYT <small></small></div>
      </div>

      <!-- ARIZA BERISH BUTTON (321.png rasmi bilan) -->
      <div class="action-button" data-url="https://my.gov.uz/uz/service/1193" data-platform="ariza">
        <img src="321.png" class="custom-icon-img" alt="ariza" onerror="this.src='https://placehold.co/44x44/0a3a4a/00ffcc?text=📄'">
        <div class="button-text">ARIZA BERISH <small></small></div>
      </div>

      <!-- TELEFON KARTASI - QO'NG'IROQ QILISH (butun maydon bosiladi) -->
      <div class="phone-card" data-phone="+998500308019">
        <div class="phone-row">
          <div class="phone-icon-big">
            <i class="fas fa-headset"></i>
          </div>
          <div class="phone-details">
            <div class="phone-label">📞 ISHONCH TELEFONI</div>
            <div class="big-phone-number">+998 71 269 80 19</div>
            <div class="big-phone-number" style="font-size: 1.1rem;">+998 50 030 80 19</div>
          </div>
        </div>
        <div class="call-btn" id="callTriggerBtn">
          <i class="fas fa-phone-volume"></i> QO'NG'IROQ QILISH
        </div>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="security-footer">
      <span><i class="fas fa-shield-halved"></i> Rasmiy veb-sayt | Barcha ma'lumotlar himoyalangan</span>
      <span><i class="fas fa-code"></i> powered by ®Fuugo</span>
    </div>
  </div>

  <script>
    // ========= YONIB UCHISH KETMA-KETLIKDA BAJARILADI =========
    // Talab: Ijtimoiy tarmoqlar yozuvi ustiga emas, balki BUTTONNING QAYERIGA BOSSA HAM KIRADI.
    // Barcha .action-button va telefon kartasi to'liq maydon bosilganda ignite + navigatsiya.
    
    // Umumiy ignite funksiyasi
    function triggerIgniteAndNavigate(element, targetUrl, isTel = false, phoneNumber = null) {
      if (element.classList.contains('ignite-active')) return;
      
      // Ignite klassini qo'shamiz -> animatsiya boshlanadi
      element.classList.add('ignite-active');
      
      // Qo'shimcha uchqun effekti (vizual)
      const spark = document.createElement('div');
      spark.style.position = 'absolute';
      spark.style.top = '50%';
      spark.style.left = '50%';
      spark.style.width = '10px';
      spark.style.height = '10px';
      spark.style.background = 'radial-gradient(circle, #ffcc55, #00ffcc)';
      spark.style.borderRadius = '50%';
      spark.style.pointerEvents = 'none';
      spark.style.zIndex = '999';
      spark.style.transform = 'translate(-50%, -50%)';
      spark.style.opacity = '1';
      element.style.position = 'relative';
      element.appendChild(spark);
      setTimeout(() => {
        if (spark && spark.remove) spark.remove();
      }, 550);
      
      // Animatsiya davomiyligi 700ms (CSS bilan mos)
      setTimeout(() => {
        if (isTel && phoneNumber) {
          window.location.href = `tel:${phoneNumber}`;
        } else if (targetUrl && targetUrl !== '#') {
          window.location.href = targetUrl;
        }
        // Klassni olib tashlash (keyingi bosishlar uchun)
        setTimeout(() => {
          element.classList.remove('ignite-active');
        }, 100);
      }, 700);
    }
    
    // 1. Barcha .action-button elementlari (Telegram, Instagram, YouTube, Veb-sayt, Ariza)
    const actionBtns = document.querySelectorAll('.action-button');
    actionBtns.forEach(btn => {
      // Butun tugma bosilganda (qayeriga bossa ham) ishlaydi
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        let url = btn.getAttribute('data-url');
        if (!url || url === '') {
          const platform = btn.getAttribute('data-platform');
          if (platform === 'telegram') url = 'https://t.me/Armygovuz';
          else if (platform === 'instagram') url = 'https://www.instagram.com/Armygovuz';
          else if (platform === 'youtube') url = 'https://www.youtube.com/@Armygovuz';
          else if (platform === 'website') url = 'https://army.gov.uz';
          else if (platform === 'ariza') url = 'https://my.gov.uz/uz/service/1193';
          else url = '#';
        }
        if (url && url !== '#') {
          triggerIgniteAndNavigate(btn, url, false, null);
        }
      });
    });
    
    // 2. Telefon kartasi: butun maydon (phone-card) bosilganda qo'ng'iroq qilish
    const phoneCard = document.querySelector('.phone-card');
    const mainPhone = phoneCard ? phoneCard.getAttribute('data-phone') : '+998500308019';
    
    function handlePhoneCall(e) {
      if (e) e.stopPropagation();
      if (!phoneCard) return;
      triggerIgniteAndNavigate(phoneCard, null, true, mainPhone);
    }
    
    if (phoneCard) {
      // Butun telefon kartasining istalgan joyini bosganda qo'ng'iroq
      phoneCard.addEventListener('click', (e) => {
        // ichidagi call-btn bosilganda ikki marta ishga tushmasligi uchun, lekin baribir ishlasin
        // biz bir marta ishlatamiz
        handlePhoneCall(e);
      });
    }
    
    // Ichidagi call-btn alohida bosilganda ham xuddi shu ignition bilan ishlaydi (oldini olish uchun event)
    const callInnerBtn = document.getElementById('callTriggerBtn');
    if (callInnerBtn) {
      callInnerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        handlePhoneCall(e);
      });
    }
    
    // Qo'shimcha: barcha tugmalar bosilganda "yonib uchish" ketma-ketlikda bajariladi.
    // Ijtimoiy tarmoqlar yozuvi ustiga emas, butun button maydoni bosilganda saytga o'tadi.
    // Shuningdek, har bir tugma oldindan yumshoq yonib turuvchi animatsiyaga ega (glowPulse).
    
    // Rasm yuklanmasa placeholder ishlaydi
    console.log("Sifrovizatsiya tizimi faol | Butun tugma maydoni bosilganda yonib uchish + navigatsiya");
  </script>
</body>
</html>
